<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Check your email</title>
    <style>
      body {
        font-family: "Montserrat", system-ui, -apple-system, sans-serif;
        background: #f7f7fb;
        margin: 0;
        color: #0f172a;
      }
      .wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
      }
      .card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        padding: 28px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        text-align: center;
      }
      .title {
        font-size: 20px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      .muted {
        color: #64748b;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1 class="title">Check your email</h1>
        <p class="muted">
          We sent a login link to <strong>{{ email }}</strong>.
        </p>
        <p class="muted">The link expires soon for your security.</p>
      </div>
    </div>
  </body>
</html>
