<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ProfePanda Login</title>
    <style>
      body {
        font-family: "Montserrat", system-ui, -apple-system, sans-serif;
        background: #f7f7fb;
        margin: 0;
        color: #0f172a;
      }
      .wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
      }
      .card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        padding: 28px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }
      .title {
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      .muted {
        color: #64748b;
        font-size: 14px;
        margin-bottom: 20px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        box-sizing: border-box;
        border-radius: 12px;
        padding: 12px 16px;
        font-weight: 600;
        border: 1px solid #e2e8f0;
        background: #fff;
        color: #0f172a;
        text-decoration: none;
        cursor: pointer;
      }
      .btn-primary {
        background: #475dd7;
        color: #fff;
        border-color: transparent;
        gap: 8px;
      }
      .btn-primary img {
        width: 18px;
        height: 18px;
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 18px 0;
        color: #94a3b8;
        font-size: 12px;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #e2e8f0;
      }
      label {
        font-size: 12px;
        font-weight: 600;
        color: #334155;
        display: block;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #e2e8f0;
        font-size: 14px;
        box-sizing: border-box;
      }
      input:focus {
        outline: none;
        border-color: #c7d2fe;
        box-shadow: 0 0 0 3px rgba(71, 93, 215, 0.15);
      }
      .actions {
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1 class="title">Log in to ProfePanda</h1>
        <p class="muted">Save your progress and enroll in courses.</p>

        {% if oauth_ready %}
          <a class="btn btn-primary" href="{{ url_for('public_auth.google_start', next=next_url) }}">
            <img src="/static/assets/icons/google.svg" alt="" aria-hidden="true" />
            Continue with Google
          </a>
        {% endif %}

        <div class="divider">or</div>

        <form method="post" action="{{ url_for('public_auth.magic_start') }}">
          <input type="hidden" name="next" value="{{ next_url }}">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required placeholder="you@example.com" />
          <div class="actions">
            <button class="btn" type="submit">Send magic link</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
